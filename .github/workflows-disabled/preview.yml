name: Deploy Preview

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'app-src/**'

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-src/package-lock.json

      - name: Install dependencies
        working-directory: app-src
        run: npm ci

      - name: Build
        working-directory: app-src
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create preview directory
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g')
          mkdir -p preview/$SAFE_BRANCH
          cp -r app-src/dist/* preview/$SAFE_BRANCH/
          cp app-src/dist/index.html preview/$SAFE_BRANCH/404.html
          echo "SAFE_BRANCH=$SAFE_BRANCH" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages (preview)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview
          destination_dir: preview
          keep_files: true

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.SAFE_BRANCH;
            const previewUrl = `https://nou-techne.github.io/information-communication-commons/preview/${branch}/`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed!**\n\n📍 ${previewUrl}\n\n_Updates automatically on push to this branch._`
            });
