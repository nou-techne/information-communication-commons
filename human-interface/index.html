<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Interface · commons.id</title>
  <meta name="description" content="Real-time overview dashboard of commons.id">
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-0: #0a0a0a; --bg-1: #141414; --bg-2: #1a1a1a; --bg-3: #222222;
      --border: #2a2a2a; --text: #e5e5e5; --text-dim: #888; --text-muted: #555;
      --accent: #c4956a; --green: #4ade80; --red: #f87171; --blue: #60a5fa;
    }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-0); color: var(--text); display: flex; flex-direction: column; }
    a { color: var(--accent); text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }

    /* Main layout: header + 3-column dashboard */
    #app { display: flex; flex-direction: column; height: 100%; }
    header { background: var(--bg-1); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header h1 span { color: var(--accent); }
    header .controls { display: flex; gap: 12px; align-items: center; }
    header .time { font-size: 0.8rem; color: var(--text-dim); font-family: 'Fira Code'; }
    header button { background: var(--bg-2); border: 1px solid var(--border); color: var(--text-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    header button:hover { border-color: var(--accent); color: var(--text); }

    /* Dashboard grid */
    .dashboard { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; flex: 1; overflow: hidden; padding: 8px; }
    .panel { background: var(--bg-1); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .panel-header { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em; }
    .panel-content { flex: 1; overflow-y: auto; padding: 12px; font-size: 0.8rem; }
    .panel-content::-webkit-scrollbar { width: 6px; }
    .panel-content::-webkit-scrollbar-track { background: transparent; }
    .panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Left column: Chain state */
    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-dim); }
    .stat-value { color: var(--accent); font-weight: 600; font-family: 'Fira Code'; }
    .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .mini-stat { background: var(--bg-2); border: 1px solid var(--border); padding: 8px; border-radius: 6px; text-align: center; }
    .mini-stat-num { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    .mini-stat-label { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }

    /* Center column: nested tabs/sections */
    .tabbed { display: flex; flex-direction: column; height: 100%; }
    .tabs { display: flex; gap: 1px; border-bottom: 1px solid var(--border); padding: 0; background: var(--bg-2); }
    .tab { padding: 8px 12px; font-size: 0.75rem; color: var(--text-dim); cursor: pointer; border: none; background: transparent; flex: 1; text-align: center; }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: var(--bg-0); }
    .tab-content { flex: 1; overflow-y: auto; display: none; }
    .tab-content.active { display: block; }

    /* API status grid */
    .api-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .api-card { background: var(--bg-2); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 10px; border-radius: 4px; }
    .api-card.err { border-left-color: var(--red); }
    .api-method { font-size: 0.65rem; color: var(--accent); text-transform: uppercase; font-weight: 700; }
    .api-path { font-family: 'Fira Code'; font-size: 0.7rem; margin: 2px 0; }
    .api-count { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .api-meta { font-size: 0.65rem; color: var(--text-muted); }

    /* Distribution bars */
    .dist-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .dist-label { width: 70px; font-size: 0.7rem; color: var(--text-dim); }
    .dist-bar { flex: 1; height: 6px; background: var(--bg-3); border-radius: 3px; overflow: hidden; }
    .dist-bar-fill { height: 100%; background: var(--accent); }

    /* Agent cards (compact) */
    .agent-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 8px; cursor: pointer; }
    .agent-card:hover { border-color: var(--accent); }
    .agent-name { font-weight: 600; font-size: 0.8rem; }
    .agent-meta { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
    .agent-badge { display: inline-block; background: var(--bg-3); padding: 2px 6px; border-radius: 3px; margin-top: 4px; margin-right: 4px; }

    /* Feed items (compact) */
    .feed-item { background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 6px; cursor: pointer; font-size: 0.75rem; }
    .feed-item:hover { border-color: var(--accent); }
    .feed-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-meta { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; }
    .feed-time { font-family: 'Fira Code'; }

    /* Detail overlay (modal) */
    .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; backdrop-filter: blur(4px); align-items: center; justify-content: center; }
    .detail-overlay.visible { display: flex; }
    .detail-panel { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 24px; position: relative; }
    .detail-close { position: absolute; top: 12px; right: 12px; background: var(--bg-3); border: 1px solid var(--border); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; }
    .detail-close:hover { border-color: var(--accent); }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header>
    <h1>Human <span>Interface</span></h1>
    <div class="controls">
      <span class="time" id="time">—</span>
      <button onclick="location.reload()">Refresh</button>
    </div>
  </header>

  <!-- Dashboard -->
  <div class="dashboard">
    <!-- LEFT: Chain State -->
    <div class="panel">
      <div class="panel-header">Chain State</div>
      <div class="panel-content">
        <div class="stat-row">
          <span class="stat-label">Seq #</span>
          <span class="stat-value" id="s-chain-seq">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Participants</span>
          <span class="stat-value" id="s-participants">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Contributions</span>
          <span class="stat-value" id="s-contributions">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Artifacts</span>
          <span class="stat-value" id="s-artifacts">—</span>
        </div>
        <div class="mini-grid">
          <div class="mini-stat">
            <div class="mini-stat-num" id="count-peers">0</div>
            <div class="mini-stat-label">Peers</div>
          </div>
          <div class="mini-stat">
            <div class="mini-stat-num" id="count-agents">0</div>
            <div class="mini-stat-label">Agents</div>
          </div>
        </div>
        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
          <div class="panel-header" style="padding: 0 0 8px 0;">Dimensions</div>
          <div id="dim-bars" style="margin-top: 6px;"></div>
        </div>
      </div>
    </div>

    <!-- CENTER: API + Metrics (Tabbed) -->
    <div class="panel">
      <div class="tabs">
        <button class="tab active" onclick="switchTab(event, 'api')">API</button>
        <button class="tab" onclick="switchTab(event, 'types')">Artifacts</button>
        <button class="tab" onclick="switchTab(event, 'graph')">Network</button>
      </div>

      <div class="tabbed" style="flex: 1;">
        <!-- API Tab -->
        <div id="tab-api" class="tab-content active">
          <div class="api-grid" id="api-endpoints-grid"></div>
        </div>

        <!-- Artifacts Tab -->
        <div id="tab-types" class="tab-content">
          <div id="type-bars"></div>
        </div>

        <!-- Network Tab -->
        <div id="tab-graph" class="tab-content">
          <div id="graph-stats"></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Activity + Agents -->
    <div class="panel">
      <div class="panel-header">Agents & Activity</div>
      <div class="panel-content">
        <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);">
          <div class="panel-header" style="padding: 0 0 8px 0;">Recent</div>
          <div id="activity-feed"></div>
        </div>
        <div>
          <div class="panel-header" style="padding: 0 0 8px 0;">Agents</div>
          <div id="agent-grid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this) closeDetail()">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<script>
const API = 'https://hvbdpgkdcdskhpbdeeim.supabase.co/functions/v1/api';

// Utilities
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function timeAgo(d) { const s=Math.floor((Date.now()-new Date(d))/1000); if(s<60)return `${s}s`;if(s<3600)return `${Math.floor(s/60)}m`;if(s<86400)return `${Math.floor(s/3600)}h`;return `${Math.floor(s/86400)}d`; }
function fetchJSON(path) { return fetch(API + path).then(r => r.json()); }
function updateTime() { document.getElementById('time').textContent = new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }

// Tab switching
function switchTab(e, tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('tab-' + tabName).classList.add('active');
}

// Load all data
async function loadDashboard() {
  try {
    const [status, agents, contributions, artifacts] = await Promise.all([
      fetchJSON('/status'),
      fetchJSON('/agents'),
      fetchJSON('/contributions?limit=100&status=complete'),
      fetchJSON('/artifacts?limit=200'),
    ]);

    // Stats
    document.getElementById('s-chain-seq').textContent = status.chain_head_seq || '—';
    document.getElementById('s-participants').textContent = status.participants || '—';
    document.getElementById('s-contributions').textContent = status.contributions || '—';
    document.getElementById('s-artifacts').textContent = status.artifacts || '—';

    // Counts
    const peerCount = (agents?.agents || []).filter(a => !a.is_agent).length;
    const agentCount = (agents?.agents || []).filter(a => a.is_agent).length;
    document.getElementById('count-peers').textContent = peerCount;
    document.getElementById('count-agents').textContent = agentCount;

    // Dimensions (tabulated from artifacts)
    const dimCounts = {};
    const dimOrder = ['e', 'H', 'L', 'A', 'M', 'T', 'S'];
    (artifacts?.artifacts || []).forEach(a => {
      (a.tags || []).forEach(t => {
        if (t.startsWith('hlamt:')) {
          const d = t.split(':')[1];
          dimCounts[d] = (dimCounts[d] || 0) + 1;
        }
      });
    });
    const maxDim = Math.max(1, ...Object.values(dimCounts));
    document.getElementById('dim-bars').innerHTML = dimOrder.map(d => {
      const c = dimCounts[d] || 0;
      const pct = (c / maxDim * 100);
      const colors = { e: '#7ccfb8', H: '#c4956a', L: '#a6ed2a', A: '#8bbfff', M: '#e8a87c', T: '#ffd666', S: '#d4a0e8' };
      return `<div class="dist-row"><span class="dist-label">${d}/</span><div class="dist-bar"><div class="dist-bar-fill" style="width:${pct}%;background:${colors[d]}"></div></div><span style="width:25px;text-align:right">${c}</span></div>`;
    }).join('');

    // Type distribution
    const typeCounts = {};
    (artifacts?.artifacts || []).forEach(a => {
      typeCounts[a.type || '?'] = (typeCounts[a.type || '?'] || 0) + 1;
    });
    const maxType = Math.max(1, ...Object.values(typeCounts));
    document.getElementById('type-bars').innerHTML = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([t,c]) => {
      const pct = (c/maxType*100);
      return `<div class="dist-row"><span class="dist-label">${t}</span><div class="dist-bar"><div class="dist-bar-fill" style="width:${pct}%"></div></div><span style="width:25px;text-align:right">${c}</span></div>`;
    }).join('');

    // Agents
    document.getElementById('agent-grid').innerHTML = (agents?.agents || []).slice(0, 10).map(a => `
      <div class="agent-card" onclick="showAgent('${a.id}')">
        <div class="agent-name">${esc(a.name || 'Unknown')}</div>
        <div class="agent-meta">${a.is_agent?'🤖 Agent':'👤 Member'} · ${a.contributions} contribs</div>
      </div>`).join('');

    // Recent activity
    const recentContribs = (contributions?.contributions || []).slice(0, 12);
    document.getElementById('activity-feed').innerHTML = recentContribs.map(c => `
      <div class="feed-item" onclick="showContribution('${c.id}')">
        <div class="feed-title">${esc(c.title || 'Untitled')}</div>
        <div class="feed-meta"><span class="feed-time">${timeAgo(c.created_at)}</span></div>
      </div>`).join('');

    // API endpoints
    await loadApiStatus();
    // Graph stats
    await loadGraphStats();
  } catch(e) { console.error('Dashboard load failed:', e); }
}

async function loadApiStatus() {
  const endpoints = [
    { path: '/status', label: 'Status' },
    { path: '/agents', label: 'Agents' },
    { path: '/contributions?limit=1', label: 'Contributions' },
    { path: '/artifacts?limit=1', label: 'Artifacts' },
    { path: '/participants?limit=1', label: 'Participants' },
    { path: '/dimensions', label: 'Dimensions' },
    { path: '/chain?limit=1', label: 'Chain' },
  ];
  let html = '';
  for (const ep of endpoints) {
    try {
      const d = await fetchJSON(ep.path);
      const key = Object.keys(d)[0];
      const val = d[key];
      const count = typeof val === 'number' ? val : Array.isArray(val) ? val.length : '✓';
      html += `<div class="api-card"><div class="api-method">GET</div><div class="api-path">${ep.path.split('?')[0]}</div><div class="api-count">${count}</div></div>`;
    } catch(e) {
      html += `<div class="api-card err"><div class="api-method">GET</div><div class="api-path">${ep.path.split('?')[0]}</div><div class="api-meta">ERR</div></div>`;
    }
  }
  document.getElementById('api-endpoints-grid').innerHTML = html;
}

async function loadGraphStats() {
  try {
    const status = await fetchJSON('/status');
    document.getElementById('graph-stats').innerHTML = `
      <div class="stat-row"><span class="stat-label">Chain Head</span><span class="stat-value" style="font-size:0.75rem">${status.chain_head_seq || '—'}</span></div>
      <div class="stat-row"><span class="stat-label">Total Entries</span><span class="stat-value">${status.chain_entries || '—'}</span></div>
      <div class="stat-row"><span class="stat-label">Batch Count</span><span class="stat-value">${status.batches || '—'}</span></div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        <div class="panel-header" style="padding:0 0 8px 0">Edge Types</div>
        <div style="font-size:0.75rem;margin-top:6px">Hub ↔ Peers, Peers ↔ Contributions, Contributions ↔ REA</div>
      </div>
    `;
  } catch(e) { console.error('Graph stats failed:', e); }
}

// Detail views
function showAgent(id) { /*TODO: fetch & display*/ }
function showContribution(id) { /*TODO: fetch & display*/ }
function closeDetail() { document.getElementById('detailOverlay').classList.remove('visible'); }

// Init
setInterval(updateTime, 1000);
updateTime();
loadDashboard();
setInterval(loadDashboard, 30000); // Refresh every 30s
</script>
</body>
</html>
